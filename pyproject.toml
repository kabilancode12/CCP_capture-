[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ccp"
version = "0.1.0"
description = "Claude Capture Platform: capture Claude Code sessions, index them, build a knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Xenovex Technologies" }]
# pg8000 is a pure-Python PostgreSQL driver: no compiled library, so it also works on machines
# where company policy blocks unsigned DLLs (psycopg's binary build is blocked there).
dependencies = [
    "pg8000>=1.31,<2",
    "minio>=7.2,<8",
    # The API uses Starlette directly: FastAPI's pydantic-core is a compiled library that
    # company policy blocks. Both packages below are pure Python.
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.28,<1",  # used by Starlette's TestClient
]

[project.scripts]
# One command with sub-commands: `ccp-verify transcript ...` and `ccp-verify env`.
ccp-verify = "ccp.verify.cli:main"
# Schema migrations: `ccp-db status`, `ccp-db migrate`, `ccp-db rollback`.
ccp-db = "ccp.db.cli:main"
# Start the ingestion API.
ccp-ingest = "ccp.ingest.server:main"
# Upload transcripts from a developer machine.
ccp-capture = "ccp.capture.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccp"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["reference"]          # the old POC is kept as-is, for reading only

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax,
# SIM: simplifications, D: docstrings (Google style), N: naming, S: security checks.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D", "N", "S"]
ignore = ["D203", "D213"]               # conflicting docstring rules; we use D211 and D212

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]              # tests need no docstrings and may use assert

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

# pg8000 ships no type information; its objects are treated as untyped.
[[tool.mypy.overrides]]
module = ["pg8000", "pg8000.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs the local PostgreSQL (docker compose up); skipped if unreachable"]
# Starlette's TestClient prints a notice recommending a different HTTP package ("httpx2"). It has
# not been vetted, so we keep httpx and silence only this message.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient.:Warning"]
