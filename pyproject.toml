[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ccp"
version = "0.1.0"
description = "Claude Capture Platform: capture Claude Code sessions, index them, build a knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Xenovex Technologies" }]
# The capture client, which runs on developers' machines, needs no packages at all (standard
# library only). The server's packages are in the "server" extra: `pip install ".[server]"`.
dependencies = []

[project.optional-dependencies]
# The server: the ingestion API, the migration runner and the object store.
#   pg8000     pure-Python PostgreSQL driver: no compiled library, so it also works where company
#              policy blocks unsigned DLLs (psycopg's binary build is blocked there)
#   minio      S3-compatible object storage client
#   starlette, uvicorn   the web application (FastAPI's pydantic-core is compiled, so it is not used)
server = [
    "pg8000>=1.31,<2",
    "minio>=7.2,<8",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
]
# Everything needed to develop and test: the server's packages plus the tools.
dev = [
    "pg8000>=1.31,<2",
    "minio>=7.2,<8",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.4",  # keep equal to the version in .pre-commit-config.yaml
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.28,<1",  # used by Starlette's TestClient
]

[project.scripts]
# One command with sub-commands: `ccp-verify transcript ...` and `ccp-verify env`.
ccp-verify = "ccp.verify.cli:main"
# Schema migrations: `ccp-db status`, `ccp-db migrate`, `ccp-db rollback`.
ccp-db = "ccp.db.cli:main"
# Start the ingestion API.
ccp-ingest = "ccp.ingest.server:main"
# Index stored transcripts into PostgreSQL (server side).
ccp-index = "ccp.index.cli:main"
# Questions about the index: file history, "why was this line written".
ccp-audit = "ccp.audit.cli:main"
# Set up the dashboards in Metabase.
ccp-dashboards = "ccp.dashboards.cli:main"
# Upload transcripts from a developer machine.
ccp-capture = "ccp.capture.cli:main"
# The always-on server: ingestion API, indexer, catalog, decisions and the Explorer website.
ccp-server = "ccp.server.main:main"
# Readable catalog of the chats in MinIO, decisions with AI/human approval, the Explorer website.
ccp-catalog = "ccp.catalog.cli:main"
ccp-decisions = "ccp.decisions.cli:main"
ccp-explorer = "ccp.explorer.cli:main"
# The approach library: search, compare and restore decisions with their code.
ccp-approaches = "ccp.approaches.cli:main"
# MCP server: Claude asks "was this tried before?" (claude mcp add ccp-approaches -- ccp-mcp).
ccp-mcp = "ccp.mcp.server:main"
# Local-only capture (Phase 1): `ccp-local install`, `status`, `report`, `backfill`.
ccp-local = "ccp_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccp", "src/ccp_local"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["reference"]          # the old POC is kept as-is, for reading only

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax,
# SIM: simplifications, D: docstrings (Google style), N: naming, S: security checks.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D", "N", "S"]
ignore = ["D203", "D213"]               # conflicting docstring rules; we use D211 and D212

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "E501"]              # tests need no docstrings and may use assert
"src/ccp/dashboards/definitions.py" = ["E501"]  # one SQL question per line is easier to read

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

# pg8000 ships no type information; its objects are treated as untyped.
[[tool.mypy.overrides]]
module = ["pg8000", "pg8000.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local PostgreSQL (docker compose up); skipped if unreachable",
    "slow: starts many Git processes (slow on Windows); skip with -m \"not slow\"",
]
# Starlette's TestClient prints a notice recommending a different HTTP package ("httpx2"). It has
# not been vetted, so we keep httpx and silence only this message.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient.:Warning"]
