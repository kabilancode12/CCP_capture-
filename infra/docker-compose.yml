# Local development stack: PostgreSQL (with pgvector) and MinIO (S3-compatible storage).
#
# Usage (from the repository root):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#   docker compose --env-file .env -f infra/docker-compose.yml down        # keeps data
#   docker compose --env-file .env -f infra/docker-compose.yml down -v     # deletes data
#
# Credentials come from `.env` (see `.env.example`); none are stored in this file.
# Ports are bound to 127.0.0.1 so the services are reachable from this machine only (the server
# can be opened to the network with CCP_SERVER_BIND, see docs/install.md).

name: ccp

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO no longer publishes official images on Docker Hub or Quay (community edition is
  # source-only). Chainguard builds MinIO from source; the image is pinned by digest so every
  # machine runs exactly the same build. Update the digest deliberately, not automatically.
  # The image has no shell, so there is no container health check and no bucket-init job:
  # the application creates the bucket (MINIO_BUCKET) on first use.
  minio:
    image: cgr.dev/chainguard/minio@sha256:786cb11d340b1a657de8dc899560e36e1d1fb371d3d6f3eb6c903a0bb0cec714
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # The always-on CCP server: ingestion API + indexer (+ plug-ins) in one process, started with the
  # stack and restarted by Docker. It reads the same `.env` as everything else, but inside the
  # Compose network PostgreSQL and MinIO are reached by service name, so those values are set below.
  # Stop any `ccp-ingest` / `ccp-index` you started by hand first: both use port 8000.
  # Plug-ins are off until CCP_CATALOG_ENABLED, CCP_DECISIONS_ENABLED or CCP_EXPLORER_ENABLED is true.
  ccp-server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: ccp-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      CCP_API_HOST: 0.0.0.0
      CCP_API_PORT: "8000"
      CCP_SERVER_MIGRATE: "true"
    ports:
      - "${CCP_SERVER_BIND:-127.0.0.1}:8000:8000"

  # Dashboards (optional, so the normal stack does not start it):
  #   docker compose --env-file .env -f infra/docker-compose.yml --profile dashboards up -d
  # Metabase keeps its own settings in a small file database on a volume. It should read the data
  # as the read-only role made by `ccp-db create-reader`, never as the application's owner.
  # Inside the Compose network the database host is `postgres`, port 5432.
  metabase:
    profiles: ["dashboards"]
    image: metabase/metabase:v0.59.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase-data:/metabase-data

volumes:
  postgres-data:
  minio-data:
  metabase-data:
